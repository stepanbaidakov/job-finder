[project]
name = "job-finder-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Stepan Baidakov",email = "stepanbaidakov@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^6.0.1"
black = "^25.9.0"

[tool.black]
line-length = 119
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = true
extend_skip = [".venv", "venv", "build", "dist"]

[tool.mypy]
files = ["src", "tests"]
exclude = '(^|/)(\.venv|venv|build|dist)/'
ignore_missing_imports = true
check_untyped_defs = true
